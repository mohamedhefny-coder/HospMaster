name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.HOSPMASTER_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.HOSPMASTER_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add repository secrets HOSPMASTER_SUPABASE_URL and HOSPMASTER_SUPABASE_PUBLISHABLE_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Build web
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=HOSPMASTER_SUPABASE_URL=${{ secrets.HOSPMASTER_SUPABASE_URL }}
          --dart-define=HOSPMASTER_SUPABASE_PUBLISHABLE_KEY=${{ secrets.HOSPMASTER_SUPABASE_PUBLISHABLE_KEY }}

      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
